name: Validate JSON Schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-json-schemas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install pinned devDependencies
        run: bun install --frozen-lockfile

      - name: Verify ajv-cli installation
        run: npx ajv help

      - name: Make validation script executable
        run: chmod +x scripts/validate-json-schemas.sh

      - name: Add local bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run JSON schema validation
        run: ./scripts/validate-json-schemas.sh

      - name: Validate inventory consistency
        run: ./scripts/validate-inventory.sh

      - name: Upload validation results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-errors
          path: |
            .claude-plugin/marketplace.json
            plugins/*/.claude-plugin/plugin.json
          retention-days: 7
