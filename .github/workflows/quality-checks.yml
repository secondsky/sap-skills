name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: validate-skills
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate skill structure
        run: |
          echo "Checking skill directory structure..."
          errors=0
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            skill_dir="$plugin_dir/skills/$plugin_name"
            if [ ! -d "$skill_dir" ]; then
              echo "ERROR: Missing skill directory: $skill_dir"
              errors=$((errors + 1))
              continue
            fi
            if [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "ERROR: Missing SKILL.md in $skill_dir"
              errors=$((errors + 1))
            fi
            if [ ! -f "$skill_dir/README.md" ]; then
              echo "ERROR: Missing README.md in $skill_dir"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors structure error(s) found"
            exit 1
          fi
          echo "All skill directories have required SKILL.md and README.md"

      - name: Check for broken internal links
        run: |
          python3 - <<'PYEOF'
          import re, os, sys

          def extract_links_outside_code_blocks(content):
              """Extract markdown links that are NOT inside fenced code blocks."""
              links = []
              in_code_block = False
              for line in content.split('\n'):
                  stripped = line.strip()
                  if stripped.startswith('```'):
                      in_code_block = not in_code_block
                      continue
                  if in_code_block:
                      continue
                  cleaned = re.sub(r'`[^`]+`', '', line)
                  for m in re.finditer(r'\[(?:[^\]]*)\]\(([^)]+)\)', cleaned):
                      links.append(m.group(1))
              return links

          print("Checking for broken internal links in markdown files...")
          errors = 0
          def iter_md_files():
              for scan_root in ('plugins', 'docs'):
                  for root, dirs, files in os.walk(scan_root):
                      dirs[:] = [d for d in dirs if d != 'node_modules']
                      for f in files:
                          if f.endswith('.md'):
                              yield os.path.join(root, f)
          for filepath in iter_md_files():
              with open(filepath, 'r', encoding='utf-8', errors='replace') as fh:
                  content = fh.read()
              for link in extract_links_outside_code_blocks(content):
                  if link.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  clean = link.split('#')[0]
                  if not clean:
                      continue
                  target = os.path.normpath(os.path.join(os.path.dirname(filepath), clean))
                  if not os.path.exists(target):
                      errors += 1
                      print(f"ERROR: Broken link in {filepath} -> {link} (resolved: {target})")

          if errors:
              print(f"\nFAILED: {errors} broken internal link(s) found")
              sys.exit(1)
          else:
              print("No broken internal links found")
          PYEOF

      - name: Check for reserved words in marketplace/plugins
        run: |
          chmod +x scripts/validate-reserved-words.sh
          ./scripts/validate-reserved-words.sh

      - name: Validate repository inventory
        run: ./scripts/validate-inventory.sh

      - name: Validate bundled resources
        run: ./scripts/validate-bundled-resources.mjs

      - name: Validate command and agent frontmatter
        run: ./scripts/validate-command-agent-frontmatter.mjs

      - name: Install workflow security linters
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint_1.7.12_linux_amd64.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o zizmor-x86_64-unknown-linux-gnu.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          tar -xzf zizmor-x86_64-unknown-linux-gnu.tar.gz zizmor
          mkdir -p "$RUNNER_TEMP/bin"
          mv actionlint zizmor "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: npm run lint:workflows

      - name: Run full validation pipeline
        run: npm run validate

  hook-tests:
    name: hook-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run hook fixture tests
        run: node ./scripts/test-hooks.mjs

      - name: Run hook contract tests
        run: node ./scripts/test-hook-contracts.mjs
