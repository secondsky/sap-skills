name: MCP Freshness Audit

on:
  push:
    branches: [main]
    paths:
      - "plugins/sap-dependency-security/skills/sap-dependency-security/references/sap-mcp-inventory.json"
      - "scripts/audit-mcp-freshness.mjs"
      - ".github/workflows/mcp-freshness.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/sap-dependency-security/skills/sap-dependency-security/references/sap-mcp-inventory.json"
      - "scripts/audit-mcp-freshness.mjs"
      - ".github/workflows/mcp-freshness.yml"

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: MCP version drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # --enforce fails the job when any pinned MCP package has drifted from
      # its approvedVersion. The default (no flag) is print-only for local use
      # via `bun run audit:mcp-freshness`.
      - name: Run MCP freshness audit
        run: node ./scripts/audit-mcp-freshness.mjs --enforce
